<!DOCTYPE html>
<html>
<head>
    <title>Manage Products</title>

    <style>

        body{
            font-family:Arial;
            background:#111;
            color:white;
            padding:40px;
        }

        h1{
            color:#d4af37;
        }

        table{
            width:100%;
            border-collapse:collapse;
            margin-top:25px;
        }

        th,td{
            border:1px solid #444;
            padding:12px;
            text-align:center;
        }

        th{
            background:#222;
            color:#d4af37;
        }

        img{
            border-radius:8px;
        }

        a{
            text-decoration:none;
        }

        .btn{
            padding:8px 15px;
            border-radius:6px;
            color:white;
        }

        .add{
            background:green;
        }

        .edit{
            background:#d4af37;
            color:black;
        }

        .delete{
            background:red;
        }

        
        .gallery{
             background:#2563eb;

        }

    </style>

</head>

<body>

<h1>Manage Products</h1>

<p>
    <a class="btn add" href="/admin/products/add">
        + Add Product
    </a>
</p>

<table>

<tr>

<th>ID</th>
<th>Image</th>
<th>Name</th>
<th>Price</th>
<th>Stock</th>
<th>Action</th>

</tr>

{% for product in products %}

<tr>

<td>{{ product.id }}</td>

<td>

{% if product.image %}

<img
src="{{ url_for('static', filename='uploads/' + product.image) }}"
width="100">

{% endif %}

</td>

<td>{{ product.name }}</td>

<td>₹ {{ product.price }}</td>

<td>{{ product.stock }}</td>

<td>

<a
class="btn edit"
href="{{ url_for('edit_product', id=product.id) }}">
Edit
</a>

<a
class="btn gallery"
href="{{ url_for('product_gallery', id=product.id) }}">
Gallery
</a>

<a
class="btn delete"
href="{{ url_for('delete_product', id=product.id) }}"
onclick="return confirm('Delete this product?')">
Delete
</a>

</td>

</tr>

{% endfor %}

</table>

</body>
</html>
