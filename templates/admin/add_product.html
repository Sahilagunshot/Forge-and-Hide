{% extends "base.html" %}

{% block content %}

<div class="login-container">

<div class="login-card" style="max-width:700px;">

<h1>Add Product</h1>

<form method="POST" enctype="multipart/form-data">

<input
type="text"
name="name"
placeholder="Product Name"
required
>

<textarea
name="description"
placeholder="Description"
style="width:100%;height:120px;margin:15px 0;padding:15px;"></textarea>

<input
type="number"
step="0.01"
name="price"
placeholder="Price"
required
>

<input
type="number"
name="stock"
placeholder="Stock"
required
>

<select
name="category"
style="width:100%;padding:15px;margin:15px 0;">

<option value="">Select Category</option>

{% for category in categories %}

<option value="{{ category.id }}">
{{ category.name }}
</option>

{% endfor %}

</select>

<input
type="file"
name="image"
>

<button type="submit">

Save Product

</button>

</form>

</div>

</div>

{% endblock %}
