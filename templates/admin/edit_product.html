{% extends "base.html" %}

{% block title %}
Edit Product | Admin | Forge &amp; Hide
{% endblock %}

{% block content %}

<div class="page-head">
    <h1>Edit Product</h1>
    <p>{{ product.name }}</p>
</div>

<div class="shell-narrow" style="margin-top:30px;">

    <form method="POST" enctype="multipart/form-data" class="box">

        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="field">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" value="{{ product.name }}" required>
        </div>

        <div class="field">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="5">{{ product.description or '' }}</textarea>
        </div>

        <div class="field">
            <label for="short_description">Short Description</label>
            <input type="text" id="short_description" name="short_description" value="{{ product.short_description or '' }}">
        </div>

        <div class="field">
            <label for="long_description">Long Description</label>
            <textarea id="long_description" name="long_description" rows="8">{{ product.long_description or '' }}</textarea>
        </div>

        <div class="field-row">

            <div class="field">
                <label for="leather_type">Leather Type</label>
                <input type="text" id="leather_type" name="leather_type" value="{{ product.leather_type or '' }}">
            </div>

            <div class="field">
                <label for="hardware">Hardware</label>
                <input type="text" id="hardware" name="hardware" value="{{ product.hardware or '' }}">
            </div>

        </div>

        <div class="field-row">

            <div class="field">
                <label for="lining">Lining</label>
                <input type="text" id="lining" name="lining" value="{{ product.lining or '' }}">
            </div>

            <div class="field">
                <label for="dimensions">Dimensions</label>
                <input type="text" id="dimensions" name="dimensions" value="{{ product.dimensions or '' }}">
            </div>

        </div>

        <div class="field-row">

            <div class="field">
                <label for="weight">Weight</label>
                <input type="text" id="weight" name="weight" value="{{ product.weight or '' }}">
            </div>

            <div class="field">
                <label for="made_in">Made In</label>
                <input type="text" id="made_in" name="made_in" value="{{ product.made_in or '' }}">
            </div>

        </div>

        <div class="field">
            <label for="warranty">Warranty</label>
            <input type="text" id="warranty" name="warranty" value="{{ product.warranty or '' }}">
        </div>

        <div class="field">
            <label for="care">Care Instructions</label>
            <textarea id="care" name="care" rows="5">{{ product.care or '' }}</textarea>
        </div>

        <div class="field check-field">
            <label>
                <input type="checkbox" name="is_bestseller" {% if product.is_bestseller %}checked{% endif %}>
                Bestseller Product
            </label>
        </div>

        <div class="field-row">

            <div class="field">
                <label for="price">Price (₹)</label>
                <input type="number" step="0.01" id="price" name="price" value="{{ product.price }}" required>
            </div>

            <div class="field">
                <label for="stock">Stock</label>
                <input type="number" id="stock" name="stock" value="{{ product.stock }}" required>
            </div>

        </div>

        <div class="field">

            <label for="category">Category</label>

            <select id="category" name="category">

                <option value="">No Category</option>

                {% for category in categories %}
                <option value="{{ category.id }}" {% if product.category_id == category.id %}selected{% endif %}>
                    {{ category.name }}
                </option>
                {% endfor %}

            </select>

        </div>

        <div class="field">

            <label>Current Image</label>

            {% if product.image %}
            <img class="thumb-lg" src="{{ url_for('static', filename='uploads/' + product.image) }}" alt="{{ product.name }}">
            {% else %}
            <p class="muted">No image uploaded.</p>
            {% endif %}

            <label for="image">Upload New Image</label>
            <input type="file" id="image" name="image">

        </div>

        <div class="order-actions">

            <button type="submit" class="hero-button">
                Update Product
            </button>

            <a class="hero-button btn-outline" href="{{ url_for('products') }}">
                Back to Products
            </a>

        </div>

    </form>

</div>

{% endblock %}
