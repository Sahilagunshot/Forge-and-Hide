<!DOCTYPE html>
<html>
<head>

    <title>Edit Product</title>

    <style>

        body{
            background:#111;
            color:white;
            font-family:Arial;
            padding:40px;
        }

        h1{
            color:#d4af37;
        }

        input, textarea, select{

            width:100%;
            padding:12px;
            margin-bottom:18px;
            font-size:16px;

        }

        button{

            background:#d4af37;
            color:black;
            border:none;
            padding:14px 28px;
            cursor:pointer;
            font-size:17px;

        }

        img{

            width:180px;
            margin-bottom:20px;
            border-radius:8px;

        }

    </style>

</head>

<body>

<h1>Edit Product</h1>

<form method="POST" enctype="multipart/form-data">

<label>Name</label>

<input
type="text"
name="name"
value="{{ product.name }}"
required>


<label>Description</label>

<textarea
name="description"
rows="5">{{ product.description }}</textarea>


<label>Price</label>

<input
type="number"
step="0.01"
name="price"
value="{{ product.price }}"
required>


<label>Stock</label>

<input
type="number"
name="stock"
value="{{ product.stock }}"
required>


<label>Category</label>

<select name="category">

<option value="">No Category</option>

{% for category in categories %}

<option
value="{{ category.id }}"
{% if product.category_id == category.id %}selected{% endif %}>
{{ category.name }}
</option>

{% endfor %}

</select>

{% if product.image %}

<p><strong>Current Image</strong></p>

<img
src="{{ url_for('static', filename='uploads/' + product.image) }}">

{% endif %}

<br>

<label>Upload New Image</label>

<input
type="file"
name="image">

<br><br>

<button type="submit">

Update Product

</button>

</form>

</body>
</html>
