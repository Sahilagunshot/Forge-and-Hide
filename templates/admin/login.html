{% extends "base.html" %}

{% block content %}

<div class="login-container">

    <div class="login-card">

        <h1>Forge & Hide</h1>

        <p>Admin Login</p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <p style="color:red;">
                    {{ messages[0] }}
                </p>
            {% endif %}
        {% endwith %}

        <form method="POST">

            <input
                type="text"
                name="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

    </div>

</div>

{% endblock %}
