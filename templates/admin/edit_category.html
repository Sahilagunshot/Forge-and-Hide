{% extends "base.html" %}

{% block title %}
Edit Category | Admin | Forge &amp; Hide
{% endblock %}

{% block content %}

<div class="page-head">
    <h1>Edit Category</h1>
</div>

<div class="shell-narrow" style="margin-top:30px;">

    <form method="POST" class="box">

        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="field">
            <label for="name">Category Name</label>
            <input type="text" id="name" name="name" value="{{ category.name }}" required>
        </div>

        <div class="order-actions">

            <button type="submit" class="hero-button">
                Update Category
            </button>

            <a class="hero-button btn-outline" href="{{ url_for('categories') }}">
                Back
            </a>

        </div>

    </form>

</div>

{% endblock %}
