{% extends "base.html" %}

{% block title %}
Create Account | Forge & Hide
{% endblock %}

{% block content %}

<div class="login-container">

    <div class="login-card">

        <h1>Create Account</h1>

        <p>Join the Forge & Hide family.</p>

        <form method="POST">

            <input
                type="text"
                name="first_name"
                placeholder="First Name"
                required>

            <input
                type="text"
                name="last_name"
                placeholder="Last Name">

            <input
                type="email"
                name="email"
                placeholder="Email Address"
                required>

            <input
                type="text"
                name="phone"
                placeholder="Phone Number">

            <input
                type="password"
                name="password"
                placeholder="Password"
                required>

            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm Password"
                required>

            <button type="submit">

                Create Account

            </button>

        </form>

        <br>

        <p>

            Already have an account?

            <a href="{{ url_for('login') }}">

                Login

            </a>

        </p>

    </div>

</div>

{% endblock %}
