{% extends "base.html" %}

{% block title %}
Login | Forge & Hide
{% endblock %}

{% block content %}

<div class="login-container">

    <div class="login-card">

        <h1>Welcome Back</h1>

        <p>Login to your Forge & Hide account.</p>

        <form method="POST">

            <input
                type="email"
                name="email"
                placeholder="Email Address"
                required>

            <input
                type="password"
                name="password"
                placeholder="Password"
                required>

            <button type="submit">

                Login

            </button>

        </form>

        <br>

        <p>

            Don't have an account?

            <a href="{{ url_for('register') }}">

                Create Account

            </a>

        </p>

    </div>

</div>

{% endblock %}
